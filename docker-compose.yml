services:
  postgres:
    image: postgres:15
    container_name: dxsp02_postgres
    restart: always
    env_file:
      - ./docker/.env
    volumes:
      - ./docker/postgres:/var/lib/postgresql/data
    networks:
      - internal

  n8n:
    image: n8nio/n8n
    container_name: dxsp02_n8n
    restart: always
    env_file:
      - ./docker/.env
    volumes:
      - ./docker/n8n:/home/node/.n8n
    depends_on:
      - postgres
    networks:
      - internal
      - web

    ports:
      - "5678:5678"

  npm:
    image: jc21/nginx-proxy-manager:latest
    container_name: dxsp02_nginx_proxy_manager
    restart: always
    ports:
      - "80:80"
      - "81:81"  # 管理介面（http://localhost:81）
      - "443:443"
    volumes:
      - ./docker/npm/data:/data
      - ./docker/npm/letsencrypt:/etc/letsencrypt
    networks:
      - web

networks:
  web:
    external: false
  internal:
    driver: bridge